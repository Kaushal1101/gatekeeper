services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy

  gateway-1:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      - BACKEND_URL=http://mock-backend:8081
      - REDIS_ADDR=redis:6379
    depends_on:
      mock-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway-2:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      - BACKEND_URL=http://mock-backend:8081
      - REDIS_ADDR=redis:6379
    depends_on:
      mock-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-backend:
    build:
      context: .
      dockerfile: docker/mock-backend.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
